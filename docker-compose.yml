
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mini_crm
    volumes:
      - pgdata:/var/lib/postgresql/data   # данные БД сохраняются между запусками
    healthcheck:                          # backend ждёт, пока PostgreSQL будет готов
      test: ["CMD-SHELL", "pg_isready -U postgres -d mini_crm"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      # В Docker хост БД — имя сервиса "db", а не localhost
      DATABASE_URL: postgresql://postgres:password@db:5432/mini_crm
      JWT_SECRET: docker_demo_secret_change_me
      PORT: 5000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    # миграции -> демо-данные (seed безопасно повторяется) -> запуск сервера
    command: sh -c "npx prisma migrate deploy && node prisma/seed.js && node src/server.js"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
